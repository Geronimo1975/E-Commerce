[project]
name = "inventory-management-system"
version = "0.1.0"
description = "E-commerce platform with Streamlit interface"
requires-python = ">=3.11"
dependencies = [
    "fpdf>=1.7.2",
    "gradio>=5.12.0",
    "inventory>=2.0.1",
    "matplotlib>=3.10.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "pillow>=11.1.0",
    "plotly>=5.24.1",
    "psycopg2-binary>=2.9.10",
    "streamlit>=1.41.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
